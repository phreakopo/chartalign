[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phreakopo-chartalign"
version = "0.1.0"
description = "按段落统计图表问答的数值对齐相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "phreakopo" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://phreakopo.github.io"
Repository = "https://github.com/phreakopo/chartalign"
Issues = "https://github.com/phreakopo/chartalign/issues"

[project.scripts]
chartalign = "chartalign:main"

[tool.setuptools]
py-modules = ["chartalign"]
